<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7科智能學習系統 - Happy Learning</title>
    <!-- Tailwind CSS  CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide 圖標 CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 引入 Firebase 核心與認證 SDK (相容版) -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>

    <style>
        /* 自定義流暢滾動條 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans antialiased text-slate-800">

    <!-- 頂部導航欄 -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-100">
                    <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Happy Learning</span>
            </div>
            <div class="flex items-center space-x-3">
                <!-- 登出按鈕 -->
                <button id="logoutBtn" onclick="handleLogout()" class="hidden px-4 py-2 text-sm font-semibold text-rose-600 hover:text-rose-700 hover:bg-rose-50 rounded-xl transition-all flex items-center gap-1">
                    <i data-lucide="log-out" class="w-4 h-4"></i> 登出
                </button>
            </div>
        </div>
    </header>

    <!-- 主體內容 -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- ==================== 登入 / 註冊 區塊 ==================== -->
        <div id="authContainer" class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden transition-all duration-300">
            <div class="flex border-b border-slate-100">
                <button id="tabLogin" onclick="switchAuthTab('login')" class="w-1/2 py-4 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-slate-50/50 transition-all">立即登入</button>
                <button id="tabRegister" onclick="switchAuthTab('register')" class="w-1/2 py-4 text-center font-semibold text-slate-400 hover:text-slate-600 transition-all">用戶註冊</button>
            </div>
            
            <div class="p-8">
                <!-- 登入表單 -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">用戶名</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i data-lucide="user" class="w-4 h-4"></i></span>
                            <input type="text" id="loginUsername" required placeholder="請輸入你的用戶名" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition-all text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">密碼</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i data-lucide="lock" class="w-4 h-4"></i></span>
                            <input type="password" id="loginPassword" required placeholder="請輸入你的密碼" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition-all text-sm">
                        </div>
                    </div>
                    <button id="loginSubmitBtn" type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-100 hover:shadow-indigo-200 transition-all text-sm flex items-center justify-center gap-2">
                        驗證並登入 <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>

                <!-- 註冊表單 -->
                <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-5 hidden">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">自定義用戶名</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i data-lucide="user-plus" class="w-4 h-4"></i></span>
                            <input type="text" id="registerUsername" required placeholder="請設定你的登入用戶名" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition-all text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">密碼</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i data-lucide="lock" class="w-4 h-4"></i></span>
                            <input type="password" id="registerPassword" required placeholder="請設定你的密碼" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition-all text-sm">
                        </div>
                    </div>
                    <button id="registerSubmitBtn" type="submit" class="w-full py-3 bg-violet-600 hover:bg-violet-700 text-white font-semibold rounded-xl shadow-lg shadow-violet-100 hover:shadow-violet-200 transition-all text-sm flex items-center justify-center gap-2">
                        連接雲端建立帳戶 <i data-lucide="cloud" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- ==================== 學習系統主大廳 ==================== -->
        <div id="systemHall" class="hidden space-y-8">
            <div class="bg-gradient-to-r from-indigo-900 to-slate-900 rounded-3xl p-8 text-white relative overflow-hidden shadow-xl shadow-slate-200">
                <div class="absolute -right-10 -bottom-10 w-44 h-44 bg-white/5 rounded-full blur-2xl"></div>
                <div class="absolute right-20 top-5 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl"></div>
                <div class="relative z-10 max-w-2xl">
                    <h1 class="text-3xl md:text-4xl font-extrabold mt-2 tracking-tight">
                        你好，<span id="welcomeUser" class="text-indigo-300">學習者</span>！
                    </h1>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">核心研究科目</h2>
                    <p class="text-sm text-slate-500 mt-1">請選擇以下任一學科進入深度沉浸式學習</p>
                </div>
                <!-- 只有開發者顯示 -->
                <button id="devAddSubjectBtn" onclick="openAddSubjectModal()" class="hidden px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-xl shadow-lg shadow-emerald-100 transition-all flex items-center gap-1.5">
                    <i data-lucide="plus-circle" class="w-4.5 h-4.5"></i> 添加新科目
                </button>
            </div>

            <div id="subjectGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>

        <!-- ==================== 科目詳情 / 課堂學習頁 ==================== -->
        <div id="subjectDetail" class="hidden space-y-6">
            <button onclick="goHome()" class="flex items-center gap-2 text-sm font-semibold text-indigo-600 hover:text-indigo-700 transition-all">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回學習大廳
            </button>

            <div id="subjectBanner" class="p-8 rounded-3xl text-white shadow-lg relative overflow-hidden">
                <div class="absolute right-6 top-6 opacity-10"><i data-lucide="book-open" class="w-32 h-32"></i></div>
                <div class="relative z-10"><h1 id="detailSubjectName" class="text-3xl font-extrabold tracking-tight">科目名稱</h1></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="list-video" class="w-5 h-5 text-indigo-600"></i> 課時目錄
                        </h3>
                        <!-- 只有開發者顯示 -->
                        <button id="devAddLessonBtn" onclick="openAddLessonModal()" class="hidden text-xs font-semibold text-emerald-600 hover:text-emerald-700 flex items-center gap-1">
                            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增課時
                        </button>
                    </div>
                    <div id="lessonList" class="space-y-2 max-h-[500px] overflow-y-auto pr-1"></div>
                </div>

                <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-6 md:p-8 min-h-[400px] flex flex-col">
                    <div id="contentPlaceholder" class="flex-grow flex flex-col items-center justify-center text-slate-400 py-12">
                        <div class="bg-slate-50 p-4 rounded-full mb-3"><i data-lucide="book-open" class="w-12 h-12 text-slate-300"></i></div>
                        <p class="text-sm font-medium">請在左側選擇具體課時開始研讀</p>
                    </div>
                    
                    <div id="contentDisplay" class="hidden flex-grow flex flex-col">
                        <div class="border-b border-slate-100 pb-4 mb-5 flex justify-between items-start gap-4">
                            <div>
                                <h2 id="activeLessonTitle" class="text-2xl font-bold text-slate-800">課時標題</h2>
                                <span class="inline-block bg-indigo-50 text-indigo-600 text-xs font-semibold px-2.5 py-1 rounded-md mt-2">正文課堂</span>
                            </div>
                            <!-- 只有開發者顯示 -->
                            <button id="devDelLessonBtn" onclick="handleDeleteActiveLesson()" class="hidden px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-semibold transition-all flex items-center gap-1">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 刪除此課時
                            </button>
                        </div>
                        <article id="activeLessonContent" class="text-slate-600 leading-relaxed text-base flex-grow whitespace-pre-line bg-slate-50/50 p-6 rounded-2xl border border-slate-100">
                            課時正文內容...
                        </article>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ==================== 提示彈出與模態視窗 ==================== -->
    <div id="toastBox" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 z-50 text-sm max-w-sm">
        <i id="toastIcon" data-lucide="info" class="w-5 h-5 text-indigo-400"></i>
        <span id="toastMsg">提示內容</span>
    </div>

    <!-- 增設新教學科目彈出框 -->
    <div id="addSubjectModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-5 animate-in fade-in zoom-in-95 duration-200">
            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i data-lucide="folder-plus" class="w-5 h-5 text-emerald-600"></i> 增設新教學科目</h3>
            <form onsubmit="handleCreateSubject(event)" class="space-y-4">
                <input type="text" id="newSubName" required placeholder="科目名稱" class="w-full px-4 py-2 bg-slate-50 border rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                <select id="newSubIcon" class="w-full px-4 py-2 bg-slate-50 border rounded-xl text-sm focus:outline-none"><option value="book-open">書本</option><option value="calculator">計算器</option><option value="languages">語言</option><option value="atom">物理/原子</option><option value="beaker">化學/燒杯</option><option value="leaf">生物/葉子</option><option value="landmark">歷史/地標</option></select>
                <select id="newSubColor" class="w-full px-4 py-2 bg-slate-50 border rounded-xl text-sm focus:outline-none"><option value="from-rose-500 to-red-500">緋紅烈焰</option><option value="from-blue-500 to-indigo-500">蔚藍極光</option><option value="from-purple-500 to-pink-500">紫羅幻境</option><option value="from-cyan-500 to-blue-500">冰晶之藍</option><option value="from-emerald-500 to-teal-500">薄荷翠綠</option><option value="from-amber-500 to-orange-500">暖陽琥珀</option></select>
                <div class="flex gap-3">
                    <button type="button" onclick="closeAddSubjectModal()" class="w-1/2 py-2 border rounded-xl hover:bg-slate-50 font-semibold text-slate-600 transition-all">取消</button>
                    <button type="submit" class="w-1/2 py-2 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 transition-all">確認創建</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 編寫全新課時彈出框 -->
    <div id="addLessonModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-5 animate-in fade-in zoom-in-95 duration-200">
            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i data-lucide="file-plus-2" class="w-5 h-5 text-emerald-600"></i> 編寫全新教學課時</h3>
            <form onsubmit="handleCreateLesson(event)" class="space-y-4">
                <input type="text" id="newLessonTitle" required placeholder="課時名稱 (例如：第一課：古文賞析)" class="w-full px-4 py-2 bg-slate-50 border rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                <textarea id="newLessonContent" rows="8" required placeholder="教學正文內容..." class="w-full px-4 py-2 bg-slate-50 border rounded-xl text-sm focus:outline-none focus:border-indigo-500"></textarea>
                <div class="flex gap-3">
                    <button type="button" onclick="closeAddLessonModal()" class="w-1/2 py-2 border rounded-xl hover:bg-slate-50 font-semibold text-slate-600 transition-all">取消</button>
                    <button type="submit" class="w-1/2 py-2 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 transition-all">正式發佈課時</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 自定義完美安全刪除確認彈窗 (100% 繞過 iframe 的 alert 封鎖) -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-5 text-center animate-in fade-in zoom-in-95 duration-200">
            <h3 id="confirmTitle" class="text-lg font-bold text-slate-800">確認刪除？</h3>
            <p id="confirmMessage" class="text-xs text-slate-500">此操作不可撤回。</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="w-1/2 py-2 border rounded-xl hover:bg-slate-50 font-semibold text-slate-600 transition-all">取消</button>
                <button id="confirmProceedBtn" class="w-1/2 py-2 bg-rose-600 text-white rounded-xl font-semibold hover:bg-rose-700 transition-all">確認刪除</button>
            </div>
        </div>
    </div>

            authDomain: "happy-learning-system.firebaseapp.com",
            projectId: "happy-learning-system",
            storageBucket: "happy-learning-system.firebasestorage.app",

        const DEVELOPER_USER = "PacoIp";
        const DEVELOPER_PASS = "eusoupacopee";

        // 7科預設精緻教學大綱數據
        const defaultSubjects = [
            {
                id: "chinese", name: "語文", icon: "book-open", color: "from-rose-500 to-red-500",

                    { title: "《沁園春·雪》精讀解析", content: "「江山如此多嬌，引無數英雄競折腰。」\n\n【歷史背景】這首詞作於1936年2月。當時紅軍長征到達陝北，面對白雪覆蓋的雄偉高原，革命豪情躍然紙上。\n\n【核心賞析】上闋重在寫景，展現北國冰雪封道的雄奇壯觀；下闋轉入議論，評說歷史帝王秦皇漢武，引出當代革命人民才是主宰歷史的風流人物。" },
                    { title: "文言文文法：18個常考虛詞歸納", content: "掌握文言文，突破口在於關鍵虛詞的語境判定。\n\n【重點突破】\n1.「之」：作代詞、結構助詞（的）以及動詞（去往）的辨析。\n2.「而」：表示並列、轉折（然而）、順承關係的精準判斷方法。\n3.「以」：表示原因（因為）、工具（用）的判讀技巧。" }

                lessons: [
                    { title: "導數的單調性與極值運算法則", content: "導數是分析函數單調性與尋找極值點的強力工具。\n\n【標準求值四部曲】\n1. 寫出函數 f(x) 的定義域（最重要、最容易疏忽）。\n2. 求出導函數 f'(x)。\n3. 令 f'(x) = 0，求出所有的關鍵駐點。\n4. 劃分區間，列表分析 f'(x) 的正負值，進而鎖定極大值與極小值。" }
                ]
            },
            {
                id: "english", name: "英語", icon: "languages", color: "from-purple-500 to-pink-500",
                lessons: [
                    { title: "高級定語從句：關係詞的精妙運用", content: "主句與從句的完美連接：Defining and Non-defining Relative Clauses.\n\n【黃金考點】\n1. 「That」與「Which」的決戰：在非限定性定語從句或緊跟介詞後，絕對不能使用「That」！\n2. 「Whose」的替換語法：Whose + 名詞 = The + 名詞 + of which." }

                ]
            },
            {

                ]
            },

                ]

            {
                id: "history", name: "歷史", icon: "landmark", color: "from-amber-500 to-orange-500",
                lessons: [
                    { title: "兩次工業革命的科技跨越與世界重塑", content: "「蒸汽機」與「發電機」如何開啟現代文明進程。\n\n【第一次工業革命】\n- 以英國為核心，煤炭為新動力源，蒸汽機普遍裝配，工廠制度確立。\n\n【第二次工業革命】\n- 多國同時起跑，電力與內燃機強勢登場，重工業取代輕工業，世界市場最終成型。" }
                ]
            }
        ];

        // 全局狀態
        let currentUser = null;
        let subjects = [];
        let activeSubjectId = null;
        let activeLessonIndex = null;
        let confirmCallback = null;

        // 核心安全機制：自動維持登入
        auth.onAuthStateChanged((user) => {
            if (user) {
                // 從臨時 Email 中解出原始用戶名
                const username = user.email.split('@')[0];
                currentUser = { username: username, isDeveloper: false };
                enterSystem();
            }
        });

        // ==================== 彈出提示模組 ====================
        function showToast(msg, iconName = 'info', delay = 4000) {
            const toast = document.getElementById('toastBox');
            const toastMsg = document.getElementById('toastMsg');
            document.getElementById('toastIcon').setAttribute('data-lucide', iconName);
            toastMsg.innerText = msg;
            lucide.createIcons();
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            if(window.toastTimer) clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, delay);
        }

        function showConfirm(title, message, onProceed) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            confirmCallback = onProceed;
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmModal').classList.add('flex');
            document.getElementById('confirmProceedBtn').onclick = function() {
                if (confirmCallback) confirmCallback();
                closeConfirmModal();
            };
        }
        
        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
            document.getElementById('confirmModal').classList.remove('flex');
        }

        // ==================== 課程數據持久化 ====================
        function initData() {
            let storedSubjects = localStorage.getItem('happy_learning_subjects');
            if (storedSubjects) {
                subjects = JSON.parse(storedSubjects);
            } else {
                subjects = defaultSubjects;
                localStorage.setItem('happy_learning_subjects', JSON.stringify(subjects));
            }
        }

        function renderNavbar() {
            const logoutBtn = document.getElementById('logoutBtn');
            const devBtns = ['devAddSubjectBtn', 'devAddLessonBtn', 'devDelLessonBtn'];
            
            if (currentUser) {
                if(logoutBtn) logoutBtn.classList.remove('hidden');
                devBtns.forEach(id => {
                    const btn = document.getElementById(id);
                    if(btn) currentUser.isDeveloper ? btn.classList.remove('hidden') : btn.classList.add('hidden');
                });
            } else {
                if(logoutBtn) logoutBtn.classList.add('hidden');
                devBtns.forEach(id => {
                    const btn = document.getElementById(id);
                    if(btn) btn.classList.add('hidden');
                });
            }
            lucide.createIcons();
        }

        function switchAuthTab(type) {
            if (type === 'login') {
                document.getElementById('tabLogin').className = "w-1/2 py-4 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-slate-50/50 transition-all";
                document.getElementById('tabRegister').className = "w-1/2 py-4 text-center font-semibold text-slate-400 hover:text-slate-600 transition-all";
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                document.getElementById('tabRegister').className = "w-1/2 py-4 text-center font-semibold text-violet-600 border-b-2 border-violet-600 bg-slate-50/50 transition-all";
                document.getElementById('tabLogin').className = "w-1/2 py-4 text-center font-semibold text-slate-400 hover:text-slate-600 transition-all";
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('loginForm').classList.add('hidden');
            }
        }

        // ==================== 進階登入邏輯 ====================
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('loginSubmitBtn');

            // 1. 本地超級管理員 PacoIp 通道 (即刻給予最高增刪改權限)
            if (u === DEVELOPER_USER && p === DEVELOPER_PASS) {
                currentUser = { username: u, isDeveloper: true };
                showToast("尊貴的開發者 PacoIp，您已登入並啟動最高教研管理特權！", "shield-check");
                enterSystem();
                return;
            }

            btn.innerText = "連線雲端資料庫中...";
            
            // 2. 自動判斷輸入的是標準 Email 還是純用戶名，並對密碼實施底層長度安全填充 (繞過 Firebase 必須大於等於6位的強制限制)
            const emailToSend = u.includes('@') ? u : `${u}@happylearning.local`;
            const securePassword = p + "_secret_padding_happy_learning";
            
            auth.signInWithEmailAndPassword(emailToSend, securePassword)
                .then((userCredential) => {
                    showToast(`歡迎回來，${u}！系統已從雲端載入您的個人進度。`, "check-circle-2");
                    btn.innerHTML = `驗證並登入 <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                    lucide.createIcons();
                })
                .catch((error) => {
                    btn.innerHTML = `驗證並登入 <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                    lucide.createIcons();
                    console.error("Firebase Auth Error:", error);

                    // 精準提示
                    if (error.code === 'auth/operation-not-allowed') {
                        showToast("登入失敗：請前往 Firebase 控制台開啟 Email/Password 的 Enable 開關！", "shield-alert");
                    } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        showToast("登入失敗：用戶名或密碼不正確，請重新輸入！", "x-circle");
                    } else if (error.code === 'auth/invalid-email') {
                        showToast("登入失敗：輸入的格式不合規，請勿帶有空格或特殊字符！", "alert-triangle");
                    } else {
                        showToast(`錯誤：${error.message}`, "x-circle");
                    }
                });
        }

        // ==================== 進階雲端註冊邏輯 ====================
        function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('registerUsername').value.trim();
            const p = document.getElementById('registerPassword').value.trim();
            const btn = document.getElementById('registerSubmitBtn');

            if (u === DEVELOPER_USER) {
                showToast("保護限制：系統不允許註冊名為 PacoIp 的公用帳號。", "shield-alert");
                return;
            }

            btn.innerText = "雲端檔案安全加密中...";
            
            const emailToSend = u.includes('@') ? u : `${u}@happylearning.local`;
            // 後台自動對用戶密碼進行填充，使其長度必然符合 Google 雲端庫的安全標準
            const securePassword = p + "_secret_padding_happy_learning";

            auth.createUserWithEmailAndPassword(emailToSend, securePassword)
                .then((userCredential) => {
                    showToast("帳號創建成功！帳密已加密存入 Firebase 雲端伺服器。", "cloud-lightning");
                    btn.innerHTML = `連接雲端創建帳戶 <i data-lucide="cloud" class="w-4 h-4"></i>`;
                    lucide.createIcons();
                })
                .catch((error) => {
                    btn.innerHTML = `連接雲端創建帳戶 <i data-lucide="cloud" class="w-4 h-4"></i>`;
                    lucide.createIcons();
                    console.error("Firebase Reg Error:", error);

                    if (error.code === 'auth/operation-not-allowed') {
                        showToast("註冊失敗：請先去 Firebase 啟用「電子郵件/密碼」認證功能！", "shield-alert");
                    } else if (error.code === 'auth/email-already-in-use') {
                        showToast("註冊失敗：該用戶名已被註冊過，請換一個！", "user-minus");
                    } else if (error.code === 'auth/invalid-email') {
                        showToast("註冊失敗：用戶名不合規（請勿含有空格或特殊符號）！", "alert-triangle");
                    } else {
                        showToast(`註冊失敗：${error.message}`, "x-circle");
                    }
                });
        }

        // 登出
        function handleLogout() {
            if (currentUser && !currentUser.isDeveloper) {
                auth.signOut();
            }
            
            currentUser = null;
            document.getElementById('loginUsername').value = "";
            document.getElementById('loginPassword').value = "";
            document.getElementById('registerUsername').value = "";
            document.getElementById('registerPassword').value = "";

            document.getElementById('authContainer').classList.remove('hidden');
            document.getElementById('systemHall').classList.add('hidden');
            document.getElementById('subjectDetail').classList.add('hidden');
            renderNavbar();
            showToast("您已成功安全登出系統。", "log-out");
        }

        // ==================== 頁面渲染邏輯 ====================
        function enterSystem() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('systemHall').classList.remove('hidden');
            document.getElementById('subjectDetail').classList.add('hidden');
            document.getElementById('welcomeUser').innerText = currentUser.username;
            renderNavbar();
            renderSubjectGrid();
        }

        // 修正 goHome 的行為，使其在登入後能正常回到大廳並渲染科目
        function goHome() {
            if (currentUser) {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('systemHall').classList.remove('hidden');
                document.getElementById('subjectDetail').classList.add('hidden');
                renderNavbar();
                renderSubjectGrid();
            }
        }

        // ==================== 學科網格渲染 ====================
        function renderSubjectGrid() {
            const grid = document.getElementById('subjectGrid');
            grid.innerHTML = "";
            subjects.forEach((sub) => {
                const subCard = document.createElement('div');
                subCard.className = "bg-white rounded-2xl border border-slate-200 p-5 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer relative";
                subCard.setAttribute('onclick', `openSubjectDetail('${sub.id}')`);
                
                let deleteBtnHtml = (currentUser && currentUser.isDeveloper) ? 
                    `<button onclick="handleDeleteSubject(event, '${sub.id}')" class="absolute top-4 right-4 text-slate-400 hover:text-rose-600 p-1.5 hover:bg-rose-50 rounded-lg transition-all z-20"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : "";
                
                subCard.innerHTML = `${deleteBtnHtml}
                    <div class="bg-gradient-to-br ${sub.color} text-white p-3 rounded-xl w-12 h-12 flex items-center justify-center shadow-md"><i data-lucide="${sub.icon || 'book-open'}" class="w-6 h-6"></i></div>
                    <h3 class="text-lg font-bold text-slate-800 mt-5">${sub.name}</h3>`;
                grid.appendChild(subCard);
            });
            lucide.createIcons();
        }

        function openSubjectDetail(subId) {
            activeSubjectId = subId;
            activeLessonIndex = null;
            const sub = subjects.find(s => s.id === subId);
            if (!sub) return;
            document.getElementById('systemHall').classList.add('hidden');
            document.getElementById('subjectDetail').classList.remove('hidden');
            document.getElementById('detailSubjectName').innerText = sub.name;
            renderLessonsList();
            renderLessonContent();
        }

        function renderLessonsList() {
            const list = document.getElementById('lessonList');
            list.innerHTML = "";
            const sub = subjects.find(s => s.id === activeSubjectId);
            if (!sub || !sub.lessons || sub.lessons.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">暫無課時</p>`;
                return;
            }
            sub.lessons.forEach((lesson, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 rounded-xl text-sm font-medium border ${activeLessonIndex === i ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-slate-50 border-transparent hover:bg-slate-100 transition-all'}`;
                btn.setAttribute('onclick', `selectLesson(${i})`);
                btn.innerHTML = `${lesson.title}`;
                list.appendChild(btn);
            });
        }

        function selectLesson(index) {
            activeLessonIndex = index;
            renderLessonsList();
            renderLessonContent();
        }

        function renderLessonContent() {
            const placeholder = document.getElementById('contentPlaceholder');
            const display = document.getElementById('contentDisplay');
            const sub = subjects.find(s => s.id === activeSubjectId);
            if (activeLessonIndex === null || !sub || !sub.lessons[activeLessonIndex]) {
                placeholder.classList.remove('hidden');
                display.classList.add('hidden');
                return;
            }
            placeholder.classList.add('hidden');
            display.classList.remove('hidden');
            document.getElementById('activeLessonTitle').innerText = sub.lessons[activeLessonIndex].title;
            document.getElementById('activeLessonContent').innerText = sub.lessons[activeLessonIndex].content;
        }

        // ==================== 開發者管理行為 ====================
        function handleDeleteSubject(event, subId) {
            event.stopPropagation();
            const sub = subjects.find(s => s.id === subId);
            showConfirm("確認刪除科目", `您確定要將科目《${sub.name}》從課表上徹底移除嗎？`, function() {
                subjects = subjects.filter(s => s.id !== subId);
                localStorage.setItem('happy_learning_subjects', JSON.stringify(subjects));
                showToast(`科目《${sub.name}》已成功移除。`, "trash-2");
                goHome();
            });
        }
        
        function openAddSubjectModal() { 
            document.getElementById('addSubjectModal').classList.remove('hidden'); 
            document.getElementById('addSubjectModal').classList.add('flex'); 
        }
        
        function closeAddSubjectModal() { 
            document.getElementById('addSubjectModal').classList.add('hidden'); 
            document.getElementById('addSubjectModal').classList.remove('flex'); 
        }
        
        function handleCreateSubject(e) {
            e.preventDefault();
            const nameInput = document.getElementById('newSubName').value.trim();
            const iconSelect = document.getElementById('newSubIcon').value;
            const colorSelect = document.getElementById('newSubColor').value;
            
            subjects.push({ 
                id: "sub_" + Date.now(), 
                name: nameInput, 
                icon: iconSelect, 
                color: colorSelect, 
                lessons: [] 
            });
            localStorage.setItem('happy_learning_subjects', JSON.stringify(subjects));
            showToast(`學科《${nameInput}》已新增上線！`, "folder-plus");
            closeAddSubjectModal(); 
            renderSubjectGrid();
            document.getElementById('newSubName').value = "";
        }
        
        function openAddLessonModal() { 
            document.getElementById('addLessonModal').classList.remove('hidden'); 
            document.getElementById('addLessonModal').classList.add('flex'); 
        }
        
        function closeAddLessonModal() { 
            document.getElementById('addLessonModal').classList.add('hidden'); 
            document.getElementById('addLessonModal').classList.remove('flex'); 
        }
        
        function handleCreateLesson(e) {
            e.preventDefault();
            const titleInput = document.getElementById('newLessonTitle').value.trim();
            const contentInput = document.getElementById('newLessonContent').value.trim();
            
            const sub = subjects.find(s => s.id === activeSubjectId);
            if (!sub.lessons) sub.lessons = [];
            
            sub.lessons.push({ 
                title: titleInput, 
                content: contentInput 
            });
            localStorage.setItem('happy_learning_subjects', JSON.stringify(subjects));
            showToast(`課時《${titleInput}》發佈成功！`, "file-plus-2");
            
            closeAddLessonModal(); 
            openSubjectDetail(activeSubjectId);
            
            document.getElementById('newLessonTitle').value = "";
            document.getElementById('newLessonContent').value = "";
        }
        
        function handleDeleteActiveLesson() {
            const sub = subjects.find(s => s.id === activeSubjectId);
            const lesson = sub.lessons[activeLessonIndex];
            showConfirm("確認刪除課時", `確定刪除課時《${lesson.title}》嗎？`, function() {
                sub.lessons.splice(activeLessonIndex, 1);
                localStorage.setItem('happy_learning_subjects', JSON.stringify(subjects));
                showToast("該課時內容已成功下線。", "trash-2");
                openSubjectDetail(activeSubjectId);
            });
        }

        window.onload = function() {
            initData();
            lucide.createIcons();
        };
    </script>
</body>
</html>
